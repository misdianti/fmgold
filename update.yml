name: Update harga emas
on:
  schedule:
    - cron: "0 2 * * *"   # 09:00 WIB
    - cron: "0 6 * * *"   # 13:00 WIB
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 playwright
      - run: sudo apt-get install -y xvfb
      - name: Scrape (Google Chrome bawaan + layar virtual)
        env:
          BROWSER_CHANNEL: chrome
        run: xvfb-run -a python scrape.py
      - name: Commit data
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data/prices.json
          git diff --staged --quiet || (git commit -m "Update harga emas" && git push)
