
name: Update harga emas

on:
  schedule:
    - cron: "0 20 * * *" # 03:00 WIB
  workflow_dispatch:

concurrency:
  group: update-harga
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Catat pemicu dan waktu mulai
        run: echo "event=${{ github.event_name }} jadwal='${{ github.event.schedule }}' mulai=$(date -u +%FT%TZ)"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install beautifulsoup4 playwright

      - run: sudo apt-get install -y xvfb

      - name: Scrape (Google Chrome bawaan + layar virtual)
        env:
          BROWSER_CHANNEL: chrome
        run: xvfb-run -a python scrape.py

      - name: Commit data
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"

          git add data/*.json

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan harga."
            exit 0
          fi

          git commit -m "Update harga emas"

          git pull --rebase origin main

          git push origin main
