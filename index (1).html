<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harga Emas Harian | FM Gold</title>
<style>
:root{--bg:#faf7f0;--card:#fff;--ink:#2b2418;--mute:#7a6f5c;--line:#eadfc6;--gold:#b8860b;--up:#16794c;--down:#b42318;--warn:#fff4d6;--warnink:#7a5200;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17130c;--card:#211b11;--ink:#f3ead6;--mute:#a99d84;--line:#3a3120;--gold:#e0b64a;--up:#4ade80;--down:#f87171;--warn:#3a2d0b;--warnink:#f0cf7a;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.4rem;margin:0 0 16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tab{flex:1;padding:10px 12px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
.tab[aria-selected="true"]{border-color:var(--gold);color:var(--gold)}
.sub{color:var(--mute);font-size:.88rem;margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.lbl{color:var(--mute);font-size:.85rem}
.big{font-size:2.1rem;font-weight:700;color:var(--gold);letter-spacing:-.5px}
.chg{font-size:.95rem;font-weight:600}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--mute)}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:420px}
th,td{padding:10px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:.78rem;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
td:first-child{font-weight:600}
tr:last-child td{border-bottom:0}
.na{color:var(--mute);font-weight:400}
svg{width:100%;height:90px;display:block}
.note{color:var(--mute);font-size:.8rem}
.warn{background:var(--warn);color:var(--warnink);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Harga Emas Batangan Hari Ini</h1>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>
<p class="note" id="foot"></p>
</main>
<script>
const rp = n => "Rp" + Math.round(n).toLocaleString("id-ID");
const WEIGHTS = ["1","2","3","5","10","25","50"];
const SOURCES = [
  {id:"antam", tab:"Antam (Logam Mulia)", file:"data/prices.json", head:"Harga dasar Antam 1 gram", col:"Harga dasar",
   foot:"Sumber: logammulia.com. Harga dasar, belum termasuk pajak PPh 0,25%."},
  {id:"galeri24", tab:"Galeri 24", file:"data/galeri24.json", head:"Harga jual Galeri 24 1 gram", col:"Harga jual",
   foot:"Sumber: galeri24.co.id. Harga jual (bukan buyback). Galeri 24 tidak menjual batangan 3 gram."}
];
const store = {};
let active = "antam";

function chg(cur, prev){
  if(cur == null || prev == null) return {t:"-", c:"flat"};
  const d = cur - prev;
  if(d === 0) return {t:"tetap", c:"flat"};
  const pct = (d/prev*100).toFixed(2).replace(".", ",");
  return {t:(d>0?"▲ ":"▼ ") + rp(Math.abs(d)) + " (" + pct + "%)", c:d>0?"up":"down"};
}
function spark(vals){
  if(vals.length < 2) return "";
  const min=Math.min(...vals), max=Math.max(...vals), rng=(max-min)||1;
  const pts = vals.map((v,i)=> (i/(vals.length-1)*300).toFixed(1)+","+(80-((v-min)/rng)*70).toFixed(1)).join(" ");
  return '<polyline fill="none" stroke="var(--gold)" stroke-width="2.5" vector-effect="non-scaling-stroke" points="'+pts+'"/>';
}
const fmtDate = (iso, opts) => new Date(iso + "T00:00:00+07:00").toLocaleDateString("id-ID", opts);
function daysOld(iso){
  const today = new Date().toLocaleDateString("en-CA", {timeZone:"Asia/Jakarta"});
  return Math.round((new Date(today+"T00:00:00Z") - new Date(iso+"T00:00:00Z"))/86400000);
}

function render(){
  const s = SOURCES.find(x => x.id === active), data = store[s.id];
  document.getElementById("tabs").innerHTML = SOURCES.map(x =>
    '<button class="tab" role="tab" aria-selected="'+(x.id===active)+'" data-id="'+x.id+'">'+x.tab+'</button>').join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { active = b.dataset.id; render(); });
  document.getElementById("foot").textContent = s.foot + " Data diperbarui otomatis dan bisa terlambat dari situs resmi. Cek situs sumber sebelum bertransaksi.";
  const h = data && data.history ? data.history : [];
  if(!h.length){
    document.getElementById("view").innerHTML = '<div class="card">Data '+s.tab+' belum tersedia.</div>';
    return;
  }
  const cur = h[h.length-1], prev = h.length > 1 ? h[h.length-2] : null;
  let sub = "Diambil " + fmtDate(cur.date, {weekday:"long",day:"numeric",month:"long",year:"numeric"});
  if(cur.source_date) sub += " | Situs memperbarui " + fmtDate(cur.source_date, {day:"numeric",month:"long"});
  const age = daysOld(cur.date);
  const warn = age >= 2 ? '<div class="warn">Data terakhir diambil '+age+' hari lalu. Cek harga terbaru di situs sumber.</div>' : "";
  const c1 = chg(cur.prices["1"], prev && prev.prices["1"]);
  const last30 = h.slice(-30).map(x => x.prices["1"]);
  const rows = WEIGHTS.map(w => {
    const p = cur.prices[w];
    if(p == null) return "<tr><td>"+w+" gram</td><td colspan='3' class='na'>tidak tersedia</td></tr>";
    const c = chg(p, prev && prev.prices[w]);
    return "<tr><td>"+w+" gram</td><td>"+rp(p)+"</td><td>"+rp(p/Number(w))+"</td><td class='"+c.c+"'>"+c.t+"</td></tr>";
  }).join("");
  document.getElementById("view").innerHTML = warn +
    '<p class="sub">'+sub+'</p>' +
    '<div class="card"><div class="lbl">'+s.head+'</div><div class="big">'+rp(cur.prices["1"])+'</div>' +
    '<div class="chg '+c1.c+'">'+c1.t+(prev ? " dibanding "+prev.date : "")+'</div>' +
    '<svg viewBox="0 0 300 90" preserveAspectRatio="none" aria-label="Tren 30 hari">'+spark(last30)+'</svg>' +
    '<div class="note">'+(last30.length>1 ? "Tren "+last30.length+" hari terakhir" : "Grafik tampil setelah ada minimal 2 hari data")+'</div></div>' +
    '<div class="card wrap"><table><thead><tr><th>Berat</th><th>'+s.col+'</th><th>Per gram</th><th>vs kemarin</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
async function load(){
  await Promise.all(SOURCES.map(async s => {
    try{
      const r = await fetch(s.file + "?v=" + Date.now(), {cache:"no-store"});
      store[s.id] = await r.json();
    }catch(e){ store[s.id] = null; }
  }));
  render();
}
load();
</script>
</body>
</html>
